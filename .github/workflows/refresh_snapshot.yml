name: Refresh data snapshot
on:
  schedule: [{ cron: "30 22 * * 1-5" }]   # weekdays, after US market close
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore: refresh data snapshot" && git push)
